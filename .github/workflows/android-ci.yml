name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# Lokaal ontbreekt een Android SDK/Gradle-installatie (zie ontwikkelnotities), dus deze
# workflow is de daadwerkelijke verificatie van de stopcriteria uit bouwspecificatie §17.1:
# stap 1 "Debug build slaagt" en stap 2 "Database unit tests slagen".
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Genereer Gradle wrapper
        run: gradle wrapper

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests (incl. Room/Robolectric)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug-APK
        uses: actions/upload-artifact@v4
        with:
          name: hiertoen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload testrapport bij falen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
